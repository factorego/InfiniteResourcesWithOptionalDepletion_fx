[mod-setting-name]
InfiniteResourcesWithOptionalDepletion_minimum=Minimum yield in percent
InfiniteResourcesWithOptionalDepletion_normal=Depletion rate (100/value)
InfiniteResourcesWithOptionalDepletion_exclusions=Exclusion list
InfiniteResourcesWithOptionalDepletion_startOnly=Resources to be infinite

[mod-setting-description]
InfiniteResourcesWithOptionalDepletion_minimum=The minimum % the infinite resource will deplete to.
InfiniteResourcesWithOptionalDepletion_normal=The "normal" value for infinite resources.  For the purposes of this mod, this is used to determine how quickly the infinite resource will deplete from 100% to the set minimum value at a rate of 100/value in percentage points.\nA value of 100 will cause it to deplete at a rate of 1% per mining cycle.\nValues under 100 will cause it to deplete faster.  25 means 4% per mining cycle, 50 is 2% per cycle, etc.\nValues over 100 will cause it to deplete slower.  200 means 1% per 2 mining cycles, while 400 is 1% per 4 cycles, etc.
InfiniteResourcesWithOptionalDepletion_exclusions=Resources to exclude from the affects of this mod.  Names must be entered using their internal game names and separated by commas, with no spaces.\n\nExamples:\nTo exclude only iron ore, type: iron-ore\nTo exclude iron and stone ores, type: iron-ore,stone
InfiniteResourcesWithOptionalDepletion_startOnly=Select which resources you want to convert to infinite once depleted.\n\nNote: Any resources already converted to infinite that fall outside the allowed zone when changing this setting will be deleted.

[shortcut-name]
infinite-resource-remover=Infinite Resource Remover